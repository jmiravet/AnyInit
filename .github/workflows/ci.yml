name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check src tests examples docs
      - run: ruff format --check src tests examples docs
      - run: mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # "numpy-only" is the job that keeps the optional dependencies optional: the core
        # and its tests must pass with no framework installed at all.
        frameworks: ["", "torch", "tensorflow", "jax flax", "torch tensorflow jax flax"]
        exclude:
          - { python-version: "3.11", frameworks: "" }
          - { python-version: "3.12", frameworks: "" }
          - { python-version: "3.13", frameworks: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e '.[dev]' ${{ matrix.frameworks }}
      - run: pytest -q -m "not slow" --cov=anyinit --cov-report=xml
      - name: Upload coverage
        # The all-frameworks job is the one that exercises every backend.
        if: matrix.python-version == '3.12' && matrix.frameworks == 'torch tensorflow jax flax'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  platforms:
    # The weights are drawn in NumPy and the core is pure Python, so the other platforms
    # mainly need the import guards and the PyTorch path checked.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        frameworks: ["", "torch"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]" ${{ matrix.frameworks }}
      - run: pytest -q -m "not slow"

  oldest:
    # The lowest versions pyproject.toml claims to support.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          pip install "numpy==1.21.6" "pytest==7.0"
          pip install --no-deps -e .
      - run: pytest -q -m "not slow"
